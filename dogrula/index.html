<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Miniakent</title>
<!-- E-posta doğrulama ve şifre yenileme bağlantılarının açıldığı sayfa (2026-11-05). Firebase'in kendi sayfası bağlantıda apiKey boş geldiği için çalışmadı. -->
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #2a2620;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
[hidden] { display: none !important; }
.kutu { width: min(340px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px 20px 18px; border-radius: 14px;
	background: #faf5eb; color: #2a2620; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); text-align: center; }
h2 { margin: 0 0 14px; font-size: 19px; }
label { display: block; margin: 8px 0 4px; font-size: 13px; color: #776d60; text-align: left; }
input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfc5b4; border-radius: 10px; font-size: 16px; background: #fff; color: #2a2620; }
.gonder { display: block; width: 100%; box-sizing: border-box; margin-top: 16px; padding: 11px; border: 0; border-radius: 12px;
	background: #2a2620; color: #faf5eb; font-size: 15px; text-decoration: none; cursor: pointer; }
.gonder:disabled { opacity: 0.6; }
.mesaj { margin: 0; font-size: 15px; line-height: 1.4; }
form .mesaj { min-height: 18px; margin-top: 10px; font-size: 13px; }
.hata { color: #b23b2e; }
</style>
</head>
<body>
<div class="kutu">
	<p class="mesaj" id="durum">Doğrulanıyor…</p>
	<form id="sifre" hidden novalidate>
		<h2>Yeni Şifre</h2>
		<label for="yeni">Yeni şifre</label>
		<input id="yeni" type="password" autocomplete="new-password">
		<button class="gonder" type="submit">Şifreyi Kaydet</button>
		<p class="mesaj" id="sifreMesaj"></p>
	</form>
	<a class="gonder" id="don" href="/kontrol-deneme/" hidden>Miniakent'e Dön</a>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, applyActionCode, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const durum = document.getElementById("durum");
const sifre = document.getElementById("sifre");
const sifreMesaj = document.getElementById("sifreMesaj");
const don = document.getElementById("don");
const GECERSIZ = "Bu bağlantı geçersiz ya da süresi dolmuş.";
function bitir(metin, hata) {
	durum.textContent = metin;
	durum.classList.toggle("hata", hata);
	durum.hidden = false;
	sifre.hidden = true;
	don.hidden = false;
}
const q = new URLSearchParams(location.search);
const mod = q.get("mode"), kod = q.get("oobCode");
try {
	const auth = getAuth(initializeApp({
		apiKey: "AIzaSyCC0HI_bln18UBMEDHdAO7CmtMEM3JtM5I",
		authDomain: "miniakent.firebaseapp.com",
		projectId: "miniakent",
		appId: "1:591368262283:web:65292bb355bc8c55287a8e",
	}));
	if (!kod) {
		bitir(GECERSIZ, true);
	} else if (mod === "verifyEmail") {
		await applyActionCode(auth, kod);
		bitir("E-posta adresin doğrulandı. Miniakent'e dönüp giriş yapabilirsin.", false);
	} else if (mod === "resetPassword") {
		await verifyPasswordResetCode(auth, kod);
		durum.hidden = true;
		sifre.hidden = false;
		sifre.addEventListener("submit", async (e) => {
			e.preventDefault();
			const dugme = sifre.querySelector("button");
			dugme.disabled = true;
			sifreMesaj.textContent = "";
			sifreMesaj.classList.add("hata");
			try {
				await confirmPasswordReset(auth, kod, document.getElementById("yeni").value);
				bitir("Şifren değiştirildi. Miniakent'e dönüp yeni şifrenle giriş yapabilirsin.", false);
			} catch (h) {
				if (h.code === "auth/weak-password") sifreMesaj.textContent = "Şifre en az 6 karakter olmalı.";
				else bitir(GECERSIZ, true);
			}
			dugme.disabled = false;
		});
	} else {
		bitir(GECERSIZ, true);
	}
} catch (h) {
	bitir(GECERSIZ, true);
}
</script>
</body>
</html>
